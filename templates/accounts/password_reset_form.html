{% load static %}
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم ورود</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- Login Form Screen -->
  <div id="loginScreen" class="screen active">
    <div class="container">
        <div class="login-box">

            <h1>خوش آمدید</h1>
            <p class="subtitle m-2">فراموشی رمز عبور</p>

            <form method="post" action="{% url 'accounts:password_reset_form' %}">

                {% csrf_token %}

                <div class="form-group">
                    <label>نام کاربری یا ایمیل</label>
                    <input 
                        type="text" 
                        name="username"
                        placeholder="Username or Email"
                    >
                </div>


                <div class="form-group">
                    <label>رمز عبور جدید</label>
                    <input 
                        type="password"
                        name="password"
                        placeholder="New Password"
                    >
                </div>


                <div class="form-group">
                    <label>تکرار رمز عبور</label>
                    <input 
                        type="password"
                        name="password2"
                        placeholder="Repeat Password"
                    >
                </div>


                <button type="submit" class="btn-primary">
                    تغییر رمز
                </button>

            </form>

        </div>
    </div>
</div>

    <!-- Dashboard Screen -->
    
    {% if messages %}
    {% for message in messages %}
    <script>
        Swal.fire({
            icon: "{{ message.tags }}",
            title: "{{ message.tags|upper }}",
            text: "{{ message }}"
        });
    </script>
    {% endfor %}
{% endif %}
    
      
    </script> -->
</body>
</html>
