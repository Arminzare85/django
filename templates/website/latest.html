{% load static %}{% load web-tags %}<div class="row">
    
          <div class="active-recent-blog-carusel">
            {% for post in posts %}
            <div class="single-recent-blog-post item">
              <div class="thumb">
                <img src="{{ post.image.url }}" alt="{{ post.title }}">
              </div>
              <div class="details">
                <div class="tags">
                  <ul>
                    <li>
    {% for cat in post.category.all %}
        <a href="{% url 'blog:category' cat.name %}">
            {{ cat.name }}
        </a>
    {% endfor %}
    {{ posts|length }}
</li>
                
                </ul>
            </div>
            <a href="{% url 'blog:single' pid=post.id %}">
                <h4 class="title">{{post.title}}</h4>
            </a>
            <p>
                {{post.content|snippet:150}}
            </p>
            <h6 class="date">{{post.published_date |date:"d M Y" }}</h6>
        </div>
            </div>
            {% endfor %}
    
    </div>
    </div>
